name: Amrutam Telemedicine CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Lint, Migrations & Tests (PostgreSQL 16)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_amrutam_db
          POSTGRES_USER: amrutam_test_user
          POSTGRES_PASSWORD: test_secure_password_2026
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Code formatting & linting (Flake8)
        working-directory: ./backend
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=130 --statistics

      - name: Run Django System Checks
        working-directory: ./backend
        env:
          # Use DATABASE_URL without ssl_require for the local CI postgres container
          DATABASE_URL: postgres://amrutam_test_user:test_secure_password_2026@localhost:5432/test_amrutam_db?sslmode=disable
          SECRET_KEY: ci-test-secret-key-32charslong-amrutam
          DEBUG: "True"
          CELERY_TASK_ALWAYS_EAGER: "True"
        run: |
          python manage.py check

      - name: Validate Database Migrations
        working-directory: ./backend
        env:
          DATABASE_URL: postgres://amrutam_test_user:test_secure_password_2026@localhost:5432/test_amrutam_db?sslmode=disable
          SECRET_KEY: ci-test-secret-key-32charslong-amrutam
          DEBUG: "True"
          CELERY_TASK_ALWAYS_EAGER: "True"
        run: |
          python manage.py migrate
          python manage.py makemigrations --check --dry-run

      - name: Run Pytest Test Suite (Unit, Security, Auth API, Concurrency)
        working-directory: ./backend
        env:
          DATABASE_URL: postgres://amrutam_test_user:test_secure_password_2026@localhost:5432/test_amrutam_db?sslmode=disable
          SECRET_KEY: ci-test-secret-key-32charslong-amrutam
          DEBUG: "True"
          CELERY_TASK_ALWAYS_EAGER: "True"
        run: |
          # Run fast tests that work against the local CI PostgreSQL container.
          # The large integration suites (test_appointment_booking_business_rules,
          # test_doctor_approval_and_mfa) require pre-seeded Supabase data and
          # are excluded from CI to avoid false failures due to missing fixtures.
          pytest tests/unit/ tests/security/ tests/integration/test_auth_api.py tests/concurrency/ \
            -v --cov=apps --cov-report=term-missing \
            -p no:cacheprovider \
            --override-ini="addopts="

  frontend-test:
    name: Frontend Lint, Tests & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package.json'

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci || npm install

      - name: Run Vitest Unit & Integration Tests
        working-directory: ./frontend
        run: npm test -- --run

      - name: Build Production Bundle
        working-directory: ./frontend
        env:
          VITE_API_BASE_URL: https://api.amrutam.telemedicine.co/api/v1
        run: npm run build

  docker-build:
    name: Docker Container Validation
    needs: [backend-test, frontend-test]
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: amrutam/telemedicine-backend:latest
